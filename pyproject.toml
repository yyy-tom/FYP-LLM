[project]
name = "fyp-llm"
version = "0.1.0"
description = "FYP LLM Training with Qwen2.5 and Counsel Chat Dataset"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "datasets>=2.14.0",
    "transformers>=4.36.0",
    # torch is installed separately via pip with CUDA support - see scripts/install_pytorch_cuda10.sh
    # Cannot use +cu100 suffix in pyproject.toml (not valid PEP 508), must install via:
    # uv pip install torch==1.7.1+cu100 torchvision==0.8.2+cu100 torchaudio==0.7.2 --index-url https://download.pytorch.org/whl/cu100
    "accelerate>=0.24.0",
    "peft>=0.7.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
    "tensorboard>=2.14.0",
    "kaggle>=1.5.0",
]

[project.optional-dependencies]
# Optional dependencies for different platforms
cuda = [
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
    "autoawq>=0.2.3",  # Required for AWQ quantized models (0.2.3+ for transformers 4.36+ compatibility)
]

# Platform compatibility: PyTorch version constraint allows uv to select a compatible version
# for the current platform (macOS ARM64, Linux x86_64, etc.)
# For Linux systems requiring manylinux_2_23 compatibility, consider using a specific version