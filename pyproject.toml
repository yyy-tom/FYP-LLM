[project]
name = "fyp-llm"
version = "0.1.0"
description = "FYP LLM Training with Qwen2.5 and Counsel Chat Dataset"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "datasets>=2.20.0",
    "transformers>=4.45.0",  # Latest version, required for Qwen2.5 models
    # torch is installed separately via pip (CPU or GPU version)
    # For CPU-only training: uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
    # For GPU training: uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
    "accelerate>=1.0.0",
    "peft>=0.12.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
    "tensorboard>=2.17.0",
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
# Optional dependencies for different platforms
cuda = [
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
    "autoawq>=0.2.3",  # Required for AWQ quantized models (0.2.3+ for transformers 4.36+ compatibility)
]

# Platform compatibility: PyTorch version constraint allows uv to select a compatible version
# for the current platform (macOS ARM64, Linux x86_64, etc.)
# For Linux systems requiring manylinux_2_23 compatibility, consider using a specific version